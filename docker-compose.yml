# PostgreSQL 16 for local development and integration testing.
# Only the database is containerised; the Python ETL runs on the host.
services:
  postgres:
    image: postgres:16-alpine
    container_name: renewable-energy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renewable_energy}
      POSTGRES_USER: ${POSTGRES_USER:-renewable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renewable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
